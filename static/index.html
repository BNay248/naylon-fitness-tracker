<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrition Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #0e1117; color: white; padding: 16px; }
  .hidden { display: none; }

  /* AUTH */
  .auth-box { max-width: 360px; margin: 60px auto; background: #1e1e2e; border-radius: 12px; padding: 24px; }
  .auth-box h2 { margin-bottom: 16px; }
  .auth-box input { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #555; background: #262730; color: white; font-size: 14px; }
  .auth-box button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #4a90d9; color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
  .auth-box .toggle { text-align: center; color: #aaa; font-size: 13px; cursor: pointer; margin-top: 8px; }
  .auth-box .toggle span { color: #4a90d9; text-decoration: underline; }
  .error { color: #ff6b6b; font-size: 13px; margin-bottom: 8px; }

  /* APP */
  nav { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 12px; }
  nav a { color: #aaa; text-decoration: none; font-size: 14px; font-weight: 600; }
  nav a.active { color: white; border-bottom: 2px solid #4a90d9; padding-bottom: 4px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* Optional: style the new protein elements to match calories */
  .protein-label, .calorie-label {
    font-size: 12px;
    color: #aaa;
  }

  .protein-count, .calorie-count {
    font-size: 36px;
    font-weight: 700;
    color: #4a90d9;
  }
  .undo-btn { background: #3a3a4a; border: 1px solid #555; color: white; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .undo-btn:active { background: #555; }
  .logout-btn { background: none; border: none; color: #aaa; font-size: 13px; cursor: pointer; }

  /* FOOD GRID */
  .food-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .food-btn {
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1/1; background: #262730; color: white;
    border: 1px solid #555; border-radius: 10px; text-align: center;
    font-size: 13px; font-weight: 600; padding: 8px; overflow: hidden;
    cursor: pointer; word-break: break-word; hyphens: auto; line-height: 1.3;
    transition: background 0.15s; user-select: none;
  }
  .food-btn:active { background: #4a4a6a; }
  .food-btn span { display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .welcome { font-size: 13px; color: #aaa; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-section">
  <div class="auth-box">
    <h2 id="auth-title">Login</h2>
    <div id="auth-error" class="error hidden"></div>
    <div id="register-fields" class="hidden">
      <input id="reg-name" type="text" placeholder="Full Name">
      <input id="reg-email" type="email" placeholder="Email">
    </div>
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <div id="reg-confirm-wrap" class="hidden">
      <input id="reg-confirm" type="password" placeholder="Confirm Password">
    </div>
    <button id="auth-btn" onclick="submitAuth()">Login</button>
    <div class="toggle" onclick="toggleMode()">
      <span id="toggle-text">New here? Register</span>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-section" class="hidden">
  <nav>
    <a href="/" class="active">Tracker</a>
    <a href="/foods">Foods</a>
    <a href="/history">History</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

<div class="header">
  <div class="header-left">
    <!-- Calories -->
    <div class="calorie-label">CALORIES TODAY</div>
    <div class="calorie-count" id="calorie-total">—</div>
    
    <!-- Protein -->
    <div class="protein-label">PROTEIN TODAY</div>
    <div class="protein-count" id="protein-total">—</div>
  </div>
  <button class="undo-btn" onclick="undo()" id="undo-btn" style="display:none">↩️ Undo</button>
</div>

  <div class="food-grid" id="food-grid"></div>
</div>

<script>
  let isRegister = false;
  let latestEntryId = null;

  function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function toggleMode() {
    isRegister = !isRegister;
    document.getElementById('auth-title').textContent = isRegister ? 'Register' : 'Login';
    document.getElementById('auth-btn').textContent = isRegister ? 'Create Account' : 'Login';
    document.getElementById('toggle-text').textContent = isRegister ? 'Already have an account? Login' : 'New here? Register';
    document.getElementById('register-fields').classList.toggle('hidden', !isRegister);
    document.getElementById('reg-confirm-wrap').classList.toggle('hidden', !isRegister);
    document.getElementById('auth-error').classList.add('hidden');
  }

  async function submitAuth() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (isRegister) {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const confirm = document.getElementById('reg-confirm').value;
      if (!username || !name || !email || !password || !confirm) return showError('Please fill all fields');
      if (password !== confirm) return showError('Passwords do not match');
      if (password.length < 6) return showError('Password must be at least 6 characters');
      const res = await fetch('/api/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, name, email, password})
      });
      if (!res.ok) { const d = await res.json(); return showError(d.detail); }
    } else {
      if (!username || !password) return showError('Please enter username and password');
      const res = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      if (!res.ok) { const d = await res.json(); return showError(d.detail); }
    }
    showApp();
  }

  async function logout() {
    await fetch('/api/logout', {method: 'POST'});
    document.getElementById('auth-section').classList.remove('hidden');
    document.getElementById('app-section').classList.add('hidden');
  }

  async function showApp() {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    loadFoods();
    loadNutrition();
  }

  async function loadNutrition() {
    const res = await fetch('/api/nutrition/today');
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('calorie-total').textContent = data.total_calories;
    document.getElementById('protein-total').textContent = data.total_protein;
    latestEntryId = data.latest_id;
    document.getElementById('undo-btn').style.display = latestEntryId ? 'block' : 'none';
  }

  async function loadFoods() {
    const res = await fetch('/api/foods');
    if (!res.ok) return;
    const foods = await res.json();
    const grid = document.getElementById('food-grid');
    grid.innerHTML = '';
    foods.forEach(food => {
      const btn = document.createElement('div');
      btn.className = 'food-btn';
      btn.innerHTML = `<span>${food.name}</span>`;
      btn.onclick = () => addEntry(food.id);
      grid.appendChild(btn);
    });
  }

  async function addEntry(foodId) {
    await fetch('/api/nutrition', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({food_id: foodId})
    });
    loadNutrition();
  }

  async function undo() {
    if (!latestEntryId) return;
    await fetch(`/api/nutrition/${latestEntryId}`, {method: 'DELETE'});
    loadNutrition();
  }

  // Check if already logged in
  fetch('/api/me').then(res => {
    if (res.ok) showApp();
  });

  // Enter key on password
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAuth();
  });
</script>
</body>
</html>
