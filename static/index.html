<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrition Tracker</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1117">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #0e1117; color: white; padding: 16px; }
  .hidden { display: none; }

  /* AUTH */
  .auth-box { max-width: 360px; margin: 60px auto; background: #1e1e2e; border-radius: 12px; padding: 24px; }
  .auth-box h2 { margin-bottom: 16px; }
  .auth-box input { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #555; background: #262730; color: white; font-size: 14px; }
  .auth-box button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #4a90d9; color: white; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
  .auth-box .toggle { text-align: center; color: #aaa; font-size: 13px; cursor: pointer; margin-top: 8px; }
  .auth-box .toggle span { color: #4a90d9; text-decoration: underline; }
  .error { color: #ff6b6b; font-size: 13px; margin-bottom: 8px; }

  /* APP */
  nav { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 12px; }
  nav a { color: #aaa; text-decoration: none; font-size: 14px; font-weight: 600; }
  nav a.active { color: white; border-bottom: 2px solid #4a90d9; padding-bottom: 4px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* Optional: style the new protein elements to match calories */
  .protein-label, .calorie-label {
    font-size: 12px;
    color: #aaa;
  }

  .protein-count, .calorie-count {
    font-size: 36px;
    font-weight: 700;
    color: #4a90d9;
  }
  .undo-btn { background: #3a3a4a; border: 1px solid #555; color: white; padding: 10px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .undo-btn:active { background: #555; }
  .logout-btn { background: none; border: none; color: #aaa; font-size: 13px; cursor: pointer; }

  /* MANUAL ENTRY */
  .manual-toggle { color: #4a90d9; font-size: 13px; background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 12px; text-decoration: underline; }
  .manual-form { display: none; background: #1e1e2e; border-radius: 10px; padding: 12px; margin-bottom: 16px; gap: 8px; }
  .manual-form.open { display: flex; flex-wrap: wrap; }
  .manual-form input { flex: 1 1 100px; padding: 8px; border-radius: 8px; border: 1px solid #555; background: #262730; color: white; font-size: 14px; }
  .manual-form button { flex: 1 1 100%; padding: 10px; border-radius: 8px; border: none; background: #4a90d9; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }

  /* SYNC STATUS */
  .sync-status {
    position: fixed; left: 0; right: 0; bottom: 0;
    text-align: center; font-size: 12px; color: #e0a030;
    background: #1e1e2e; border-top: 1px solid #333;
    padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.2s ease;
    z-index: 10;
  }
  .sync-status.visible { transform: translateY(0); }
  body { padding-bottom: 48px; } /* reserve space so the banner never overlaps the last row of buttons */

  /* FOOD GRID */
  .food-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .food-btn {
    display: flex; align-items: center; justify-content: center;
    aspect-ratio: 1/1; background: #262730; color: white;
    border: 1px solid #555; border-radius: 10px; text-align: center;
    font-size: 13px; font-weight: 600; padding: 8px; overflow: hidden;
    cursor: pointer; word-break: break-word; hyphens: auto; line-height: 1.3;
    transition: background 0.15s; user-select: none;
  }
  .food-btn:active { background: #4a4a6a; }
  .food-btn span { display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .welcome { font-size: 13px; color: #aaa; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-section">
  <div class="auth-box">
    <h2 id="auth-title">Login</h2>
    <div id="auth-error" class="error hidden"></div>
    <div id="register-fields" class="hidden">
      <input id="reg-name" type="text" placeholder="Full Name">
      <input id="reg-email" type="email" placeholder="Email">
    </div>
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <div id="reg-confirm-wrap" class="hidden">
      <input id="reg-confirm" type="password" placeholder="Confirm Password">
    </div>
    <button id="auth-btn" onclick="submitAuth()">Login</button>
    <div class="toggle" onclick="toggleMode()">
      <span id="toggle-text">New here? Register</span>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-section" class="hidden">
  <nav>
    <a href="/" class="active">Tracker</a>
    <a href="/foods">Foods</a>
    <a href="/history">History</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>

<div class="header">
  <div class="header-left">
    <!-- Calories -->
    <div class="calorie-label">CALORIES TODAY</div>
    <div class="calorie-count" id="calorie-total">—</div>
    
    <!-- Protein -->
    <div class="protein-label">PROTEIN TODAY</div>
    <div class="protein-count" id="protein-total">—</div>
  </div>
  <button class="undo-btn" onclick="undo()" id="undo-btn" style="display:none">↩️ Undo</button>
</div>

  <div id="sync-status" class="sync-status"></div>

  <button class="manual-toggle" onclick="toggleManualForm()">✏️ Enter values manually</button>
  <div class="manual-form" id="manual-form">
    <input id="manual-name" type="text" placeholder="Name (optional)">
    <input id="manual-cal" type="number" placeholder="Calories" min="0" inputmode="numeric">
    <input id="manual-protein" type="number" placeholder="Protein" min="0" inputmode="numeric">
    <button onclick="addManualEntry()">Log Entry</button>
  </div>

  <div class="food-grid" id="food-grid"></div>
</div>

<script>
  let isRegister = false;
  let latestEntryId = null;

  // ---- Offline queue ----
  const QUEUE_KEY = 'tracker_pending_queue';
  const TOTALS_KEY = 'tracker_last_server_totals';

  function loadQueue() {
    try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }
    catch { return []; }
  }
  function saveQueue(queue) {
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue)); } catch {}
  }
  function loadCachedTotals() {
    try { return JSON.parse(localStorage.getItem(TOTALS_KEY)) || { total_calories: 0, total_protein: 0, latest_id: null }; }
    catch { return { total_calories: 0, total_protein: 0, latest_id: null }; }
  }
  function saveCachedTotals(totals) {
    try { localStorage.setItem(TOTALS_KEY, JSON.stringify(totals)); } catch {}
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  function renderDisplay() {
    const server = loadCachedTotals();
    const queue = loadQueue();
    const pendingCal = queue.reduce((s, e) => s + (e.calories || 0), 0);
    const pendingProtein = queue.reduce((s, e) => s + (e.protein || 0), 0);
    document.getElementById('calorie-total').textContent = server.total_calories + pendingCal;
    document.getElementById('protein-total').textContent = server.total_protein + pendingProtein;
    latestEntryId = server.latest_id;

    const undoBtn = document.getElementById('undo-btn');
    undoBtn.style.display = (queue.length > 0 || latestEntryId) ? 'block' : 'none';

    const status = document.getElementById('sync-status');
    if (queue.length > 0) {
      status.textContent = `${queue.length} entr${queue.length === 1 ? 'y' : 'ies'} queued, will sync when back online…`;
      status.classList.add('visible');
    } else {
      status.classList.remove('visible');
    }
  }

  async function flushQueue() {
    let queue = loadQueue();
    while (queue.length > 0) {
      const item = queue[0];
      try {
        const res = await fetch('/api/nutrition', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(item)
        });
        if (!res.ok) break; // e.g. auth expired — stop and let user re-login
      } catch {
        break; // network still down
      }
      queue.shift();
      saveQueue(queue);
      renderDisplay();
    }
    // Re-sync authoritative totals from the server once the queue drains
    if (queue.length === 0) await loadNutrition();
  }

  function showError(msg) {
    const el = document.getElementById('auth-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  function toggleMode() {
    isRegister = !isRegister;
    document.getElementById('auth-title').textContent = isRegister ? 'Register' : 'Login';
    document.getElementById('auth-btn').textContent = isRegister ? 'Create Account' : 'Login';
    document.getElementById('toggle-text').textContent = isRegister ? 'Already have an account? Login' : 'New here? Register';
    document.getElementById('register-fields').classList.toggle('hidden', !isRegister);
    document.getElementById('reg-confirm-wrap').classList.toggle('hidden', !isRegister);
    document.getElementById('auth-error').classList.add('hidden');
  }

  async function submitAuth() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (isRegister) {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const confirm = document.getElementById('reg-confirm').value;
      if (!username || !name || !email || !password || !confirm) return showError('Please fill all fields');
      if (password !== confirm) return showError('Passwords do not match');
      if (password.length < 6) return showError('Password must be at least 6 characters');
      const res = await fetch('/api/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, name, email, password})
      });
      if (!res.ok) { const d = await res.json(); return showError(d.detail); }
    } else {
      if (!username || !password) return showError('Please enter username and password');
      const res = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      if (!res.ok) { const d = await res.json(); return showError(d.detail); }
    }
    showApp();
  }

  async function logout() {
    await fetch('/api/logout', {method: 'POST'});
    document.getElementById('auth-section').classList.remove('hidden');
    document.getElementById('app-section').classList.add('hidden');
  }

  async function showApp() {
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    loadFoods();
    renderDisplay(); // show cached/queued state immediately, even if offline
    loadNutrition();
    flushQueue();
  }

  async function loadNutrition() {
    try {
      const res = await fetch('/api/nutrition/today');
      if (!res.ok) return;
      const data = await res.json();
      saveCachedTotals(data);
    } catch {
      // offline — keep showing cached totals
    }
    renderDisplay();
  }

  async function loadFoods() {
    const res = await fetch('/api/foods');
    if (!res.ok) return;
    const foods = await res.json();
    const grid = document.getElementById('food-grid');
    grid.innerHTML = '';
    foods.forEach(food => {
      const btn = document.createElement('div');
      btn.className = 'food-btn';
      btn.innerHTML = `<span>${food.name}</span>`;
      btn.onclick = () => addEntry(food.id, null, food.calories, food.protein);
      grid.appendChild(btn);
    });
  }

  async function addEntry(foodId, name, calories, protein) {
    const item = { client_id: uuid(), food_id: foodId, name, calories, protein };
    const queue = loadQueue();
    queue.push(item);
    saveQueue(queue);
    renderDisplay(); // optimistic: show it immediately, synced or not
    flushQueue();
  }

  function toggleManualForm() {
    document.getElementById('manual-form').classList.toggle('open');
  }

  function addManualEntry() {
    const name = document.getElementById('manual-name').value.trim();
    const calories = parseInt(document.getElementById('manual-cal').value) || 0;
    const protein = parseInt(document.getElementById('manual-protein').value) || 0;
    if (!calories && !protein) return alert('Enter calories or protein');
    addEntry(null, name, calories, protein);
    document.getElementById('manual-name').value = '';
    document.getElementById('manual-cal').value = '';
    document.getElementById('manual-protein').value = '';
  }

  async function undo() {
    const queue = loadQueue();
    if (queue.length > 0) {
      // Last action hasn't synced yet — just drop it locally, nothing to tell the server.
      queue.pop();
      saveQueue(queue);
      renderDisplay();
      return;
    }
    if (!latestEntryId) return;
    try {
      await fetch(`/api/nutrition/${latestEntryId}`, {method: 'DELETE'});
    } catch {
      return; // offline and nothing queued to undo — can't do anything
    }
    loadNutrition();
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }

  // Retry the queue whenever connectivity returns, the tab regains focus, or periodically as a fallback
  window.addEventListener('online', flushQueue);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') flushQueue();
  });
  setInterval(flushQueue, 20000);

  // Check if already logged in
  fetch('/api/me').then(res => {
    if (res.ok) showApp();
  });

  // Enter key on password
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitAuth();
  });
</script>
</body>
</html>
