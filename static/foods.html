<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foods - Tracker</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1117">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #0e1117; color: white; padding: 16px; }
  .hidden { display: none; }
  nav { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 12px; }
  nav a { color: #aaa; text-decoration: none; font-size: 14px; font-weight: 600; }
  nav a.active { color: white; border-bottom: 2px solid #4a90d9; padding-bottom: 4px; }
  .logout-btn { background: none; border: none; color: #aaa; font-size: 13px; cursor: pointer; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .add-form { background: #1e1e2e; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
  .add-form input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #555; background: #262730; color: white; font-size: 14px; }
  .add-form button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #4a90d9; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
  .food-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #222; }
  .food-row .food-name { flex: 1; font-weight: 600; }
  .food-row .food-cal { color: #aaa; font-size: 13px; min-width: 70px; }
  .food-row input { padding: 6px; border-radius: 6px; border: 1px solid #555; background: #262730; color: white; font-size: 14px; min-width: 0; }
  .food-row input[type=text] { flex: 1; }
  .food-row input[type=number] { width: 64px; text-align: center; }
  .food-row button { padding: 6px 12px; border-radius: 6px; border: none; font-size: 13px; cursor: pointer; }
  .food-row.dragging { opacity: 0.6; background: #1e1e2e; }
  .drag-handle { color: #666; font-size: 18px; padding: 4px 6px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .food-row.dragging .drag-handle { cursor: grabbing; }
  .edit-btn, .cancel-btn { background: #3a3a4a; color: white; }
  .save-btn { background: #4a90d9; color: white; }
  .del-btn { background: #6b2020; color: white; }
  .auth-box { max-width: 360px; margin: 60px auto; background: #1e1e2e; border-radius: 12px; padding: 24px; }
  .auth-box h2 { margin-bottom: 16px; }
  .auth-box input { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #555; background: #262730; color: white; font-size: 14px; }
  .auth-box button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #4a90d9; color: white; font-size: 15px; cursor: pointer; }
  .error { color: #ff6b6b; font-size: 13px; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="auth-section" class="hidden">
  <div class="auth-box">
    <h2>Login</h2>
    <div id="auth-error" class="error hidden"></div>
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="app-section" class="hidden">
  <nav>
    <a href="/">Tracker</a>
    <a href="/foods" class="active">Foods</a>
    <a href="/history">History</a>
    <a id="trainer-link" href="#" hidden>Training</a>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </nav>
  <h1>Foods</h1>

  <div class="add-form">
    <input id="food-name" type="text" placeholder="Food name">
    <input id="food-cal" type="number" placeholder="Calories" min="0">
    <input id="food-protein" type="number" placeholder="Protein" min="0">
    <button onclick="addFood()">Add Food</button>
  </div>

  <div id="food-list"></div>
</div>

<script>
  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const res = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    if (!res.ok) {
      const d = await res.json();
      document.getElementById('auth-error').textContent = d.detail;
      document.getElementById('auth-error').classList.remove('hidden');
      return;
    }
    showApp();
  }

  async function logout() {
    await fetch('/api/logout', {method: 'POST'});
    document.getElementById('app-section').classList.add('hidden');
    document.getElementById('auth-section').classList.remove('hidden');
  }

  function showApp() {
    loadTrainerLink();
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');
    loadFoods();
  }

  async function loadFoods() {
    const res = await fetch('/api/foods');
    if (!res.ok) return;
    const foods = await res.json();
    const list = document.getElementById('food-list');
    list.innerHTML = '';
    foods.forEach(food => list.appendChild(renderRow(food)));
  }

  function renderRow(food) {
    const row = document.createElement('div');
    row.className = 'food-row';
    row.innerHTML = `
      <div class="drag-handle" title="Drag to reorder">&#9776;</div>
      <div class="food-name"></div>
      <div class="food-cal">${food.calories} kcal</div>
      <div class="food-protein">${food.protein} g</div>
      <button class="edit-btn">Edit</button>
      <button class="del-btn">Delete</button>
    `;
    row.querySelector('.food-name').textContent = food.name;
    row.querySelector('.drag-handle').addEventListener('pointerdown', e => startDrag(e, row, food.id));
    row.querySelector('.edit-btn').onclick = () => startEdit(row, food);
    row.querySelector('.del-btn').onclick = () => deleteFood(food.id);
    return row;
  }

  function startEdit(row, food) {
    row.innerHTML = `
      <input type="text" class="edit-name" placeholder="Name">
      <input type="number" class="edit-cal" min="0" title="Calories">
      <input type="number" class="edit-protein" min="0" title="Protein">
      <button class="save-btn">Save</button>
      <button class="cancel-btn">Cancel</button>
    `;
    const nameInput = row.querySelector('.edit-name');
    nameInput.value = food.name;
    row.querySelector('.edit-cal').value = food.calories;
    row.querySelector('.edit-protein').value = food.protein;
    const save = () => saveFood(row, food.id);
    row.querySelector('.save-btn').onclick = save;
    row.querySelector('.cancel-btn').onclick = () => row.replaceWith(renderRow(food));
    row.querySelectorAll('input').forEach(input => input.addEventListener('keydown', e => {
      if (e.key === 'Enter') save();
      if (e.key === 'Escape') row.replaceWith(renderRow(food));
    }));
    nameInput.focus();
  }

  async function saveFood(row, id) {
    const name = row.querySelector('.edit-name').value.trim();
    const calories = parseInt(row.querySelector('.edit-cal').value) || 0;
    const protein = parseInt(row.querySelector('.edit-protein').value) || 0;
    if (!name) return alert('Please enter a food name');
    const res = await fetch(`/api/foods/${id}`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, calories, protein})
    });
    if (!res.ok) return alert('Failed to save food');
    loadFoods();
  }

  function startDrag(e, row, id) {
    e.preventDefault();
    const handle = e.currentTarget;
    const list = row.parentElement;
    const startIdx = [...list.children].indexOf(row);
    handle.setPointerCapture(e.pointerId);
    row.classList.add('dragging');

    const onMove = ev => {
      const y = ev.clientY;
      let prev = row.previousElementSibling, next = row.nextElementSibling;
      while (prev && y < prev.getBoundingClientRect().top + prev.offsetHeight / 2) {
        list.insertBefore(row, prev);
        prev = row.previousElementSibling;
      }
      while (next && y > next.getBoundingClientRect().top + next.offsetHeight / 2) {
        list.insertBefore(next, row);
        next = row.nextElementSibling;
      }
    };

    const onUp = async () => {
      handle.removeEventListener('pointermove', onMove);
      handle.removeEventListener('pointerup', onUp);
      handle.removeEventListener('pointercancel', onUp);
      row.classList.remove('dragging');
      const newIdx = [...list.children].indexOf(row);
      if (newIdx === startIdx) return;
      await fetch(`/api/foods/${id}/position`, {
        method: 'PATCH', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({position: newIdx + 1})
      });
      loadFoods();
    };

    handle.addEventListener('pointermove', onMove);
    handle.addEventListener('pointerup', onUp);
    handle.addEventListener('pointercancel', onUp);
  }

  async function addFood() {
    const name = document.getElementById('food-name').value.trim();
    const calories = parseInt(document.getElementById('food-cal').value) || 0;
    const protein = parseInt(document.getElementById('food-protein').value) || 0;
    if (!name) return alert('Please enter a food name');
    await fetch('/api/foods', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, calories, protein})
    });
    document.getElementById('food-name').value = '';
    document.getElementById('food-cal').value = '';
    document.getElementById('food-protein').value = '';
    loadFoods();
  }

  async function deleteFood(id) {
    await fetch(`/api/foods/${id}`, {method: 'DELETE'});
    loadFoods();
  }

  // Single sign-on: the same login covers the trainer app, so link to it when it's configured.
  async function loadTrainerLink() {
    try {
      const me = await (await fetch('/api/me')).json();
      const link = document.getElementById('trainer-link');
      if (me.trainer_url) { link.href = me.trainer_url; link.hidden = false; }
    } catch {} // offline: no link
  }

  fetch('/api/me').then(res => {
    if (res.ok) showApp();
    else {
      document.getElementById('auth-section').classList.remove('hidden');
    }
  });

  document.querySelectorAll('.add-form input').forEach(input =>
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addFood(); }));
</script>
</body>
</html>
